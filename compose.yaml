# Local infrastructure for Promesa. Application processes run on the host via `npm run dev`.
# Without Docker, `npm run db:start` launches the same PostgreSQL major via embedded binaries.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: promesa
      POSTGRES_PASSWORD: promesa
      POSTGRES_DB: promesa
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U promesa -d promesa']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
